name: Build installable Bilibili APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;26.3.11579264' 'cmake;3.22.1'
      - name: Check release guards and download verified tools
        run: |
          python -m unittest discover -s scripts/tests -v
          python scripts/release.py tools
          python scripts/release.py source
      - name: Build module and patches from this tag
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g dist
      - name: Restore persistent signing key
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
        run: |
          test -n "$APK_KEYSTORE_BASE64" || { echo 'Missing APK_KEYSTORE_BASE64 secret'; exit 1; }
          umask 077
          printf '%s' "$APK_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
      - name: Patch, sign and verify installable APK
        env:
          APK_KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: python scripts/release.py release
      - name: Upload verified APK and checksums
        uses: actions/upload-artifact@v4
        with:
          name: Bilibili-BiliRoamingX-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish tag release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag \
            --prerelease --title "BiliRoamingX / $RELEASE_TAG" --notes-file release-work/release-notes.md
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.run_id }}
          path: |
            release-work/*.log
            release-work/*signature.txt
            release-work/badging.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
